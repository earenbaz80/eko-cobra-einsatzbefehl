<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="coarseAsphalt" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" result="grain" />
      <feColorMatrix type="matrix" values="
        0.16 0 0 0 0.07
        0 0.18 0 0 0.08
        0 0 0.22 0 0.11
        0 0 0 0.45 0.55" in="grain" result="darkGrain" />
      <feBlend mode="multiply" in="SourceGraphic" in2="darkGrain" />
    </filter>

    <!-- Broad Iridescent Oil Slick Gradient -->
    <radialGradient id="slickGradWide" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#020202" stop-opacity="0.96" />
      <stop offset="25%" stop-color="#0B0907" stop-opacity="0.92" />
      <stop offset="48%" stop-color="#121822" stop-opacity="0.84" />
      <stop offset="65%" stop-color="#0D9488" stop-opacity="0.48" />
      <stop offset="76%" stop-color="#0284C7" stop-opacity="0.52" />
      <stop offset="85%" stop-color="#7C3AED" stop-opacity="0.50" />
      <stop offset="92%" stop-color="#DB2777" stop-opacity="0.45" />
      <stop offset="97%" stop-color="#D97706" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#05080D" stop-opacity="0.0" />
    </radialGradient>

    <!-- Linear Tire Wet Track Gradient -->
    <linearGradient id="tireTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.0" />
      <stop offset="25%" stop-color="#0B0E14" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#080A0F" stop-opacity="0.80" />
      <stop offset="75%" stop-color="#0B0E14" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Asphalt Base Layer -->
  <rect width="512" height="512" fill="#13161D" />
  <rect width="512" height="512" fill="#171C25" filter="url(#coarseAsphalt)" opacity="0.88" />

  <!-- Heavy Vehicle Damp Tire Tracks -->
  <rect x="70" y="0" width="60" height="512" fill="url(#tireTrackGrad)" />
  <rect x="380" y="0" width="60" height="512" fill="url(#tireTrackGrad)" />

  <!-- Diagonal Tar Patch Joint -->
  <path d="M 0,420 L 512,180" stroke="#0A0C10" stroke-width="7" opacity="0.8" />
  <path d="M 0,420 L 512,180" stroke="#252D3C" stroke-width="1.8" opacity="0.5" />

  <!-- Extensive Severe Frost & Age Crack Network -->
  <g opacity="0.9">
    <!-- Main arterial fissure -->
    <path d="M 230,0 Q 245,60 215,110 T 260,185 T 235,260 T 285,340 T 260,420 T 290,512" stroke="#040608" stroke-width="2.8" fill="none" stroke-linecap="round" />
    <path d="M 231,-1 Q 246,59 216,109 T 261,184 T 236,259 T 286,339 T 261,419 T 291,511" stroke="#384353" stroke-width="0.9" fill="none" stroke-linecap="round" />

    <!-- Eastward branches -->
    <path d="M 260,185 Q 310,195 345,175 T 410,190" stroke="#06080C" stroke-width="1.8" fill="none" />
    <path d="M 285,340 Q 330,360 375,345 T 440,370" stroke="#06080C" stroke-width="1.6" fill="none" />

    <!-- Westward branches -->
    <path d="M 215,110 Q 170,125 140,105 T 85,115" stroke="#06080C" stroke-width="1.7" fill="none" />
    <path d="M 235,260 Q 185,270 150,295 T 100,285" stroke="#06080C" stroke-width="1.8" fill="none" />
    <path d="M 150,295 Q 135,335 110,355" stroke="#06080C" stroke-width="1.2" fill="none" />
  </g>

  <!-- Large Center Street Oil Slick with Vibrant Spectrum Rings -->
  <g transform="translate(256, 260)">
    <!-- Oily soak zone -->
    <path d="M -85,-40 C -110,-10 -95,65 -45,95 C 10,120 75,105 110,65 C 135,25 120,-35 80,-65 C 30,-90 -50,-75 -85,-40 Z" fill="#07090D" opacity="0.80" />
    <!-- Radiant Iridescent Pool -->
    <path d="M -70,-30 C -90,-5 -75,50 -35,78 C 8,98 62,85 90,52 C 110,20 98,-28 65,-52 C 25,-72 -40,-60 -70,-30 Z" fill="url(#slickGradWide)" />
    <!-- Dense black puddle nucleus -->
    <ellipse cx="2" cy="5" rx="36" ry="24" fill="#010101" opacity="0.96" />
    <ellipse cx="-8" cy="2" rx="18" ry="12" fill="#000000" opacity="1.0" />
    <!-- Wet specular light glints -->
    <circle cx="-10" cy="-6" r="3.0" fill="#38BDF8" opacity="0.65" />
    <circle cx="16" cy="12" r="2.2" fill="#F43F5E" opacity="0.55" />
    <circle cx="-22" cy="18" r="1.8" fill="#FBBF24" opacity="0.5" />
    <circle cx="28" cy="-14" r="2.0" fill="#2DD4BF" opacity="0.5" />
  </g>

  <!-- Small Drip Spots along wheel paths -->
  <g fill="#050505" opacity="0.88">
    <ellipse cx="95" cy="180" rx="9" ry="6" />
    <ellipse cx="102" cy="220" rx="14" ry="9" />
    <ellipse cx="88" cy="255" rx="7" ry="5" />
    <circle cx="112" cy="235" r="3" />
    <ellipse cx="405" cy="310" rx="12" ry="8" />
    <ellipse cx="415" cy="350" rx="8" ry="5" />
    <circle cx="395" cy="328" r="3.2" />
  </g>
</svg>
