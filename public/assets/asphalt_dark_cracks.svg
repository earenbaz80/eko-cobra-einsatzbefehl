<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Asphalt Grain & Stone Aggregate Filter -->
    <filter id="asphaltNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="
        0.18 0 0 0 0.08
        0 0.20 0 0 0.09
        0 0 0.24 0 0.12
        0 0 0 0.42 0.58" in="noise" result="coloredNoise" />
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise" />
    </filter>

    <!-- Iridescent Oil Sheen Gradient 1 -->
    <radialGradient id="oilSheen1" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#0A0908" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#141E28" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="78%" stop-color="#8B5CF6" stop-opacity="0.50" />
      <stop offset="88%" stop-color="#EC4899" stop-opacity="0.48" />
      <stop offset="94%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </radialGradient>

    <!-- Iridescent Oil Sheen Gradient 2 (Secondary puddle) -->
    <radialGradient id="oilSheen2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080706" stop-opacity="0.92" />
      <stop offset="35%" stop-color="#11161B" stop-opacity="0.80" />
      <stop offset="60%" stop-color="#9333EA" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.40" />
      <stop offset="88%" stop-color="#F59E0B" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#05080D" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Base Dark Weathered Asphalt -->
  <rect width="512" height="512" fill="#141820" />
  <rect width="512" height="512" fill="#181D26" filter="url(#asphaltNoise)" opacity="0.85" />

  <!-- Roadway Wear Patches & Tar Repair Band -->
  <path d="M 0,180 Q 120,170 260,195 T 512,185 L 512,215 Q 380,225 240,205 T 0,200 Z" fill="#0D1017" opacity="0.65" />
  <path d="M 120,0 Q 140,160 125,320 T 150,512" stroke="#0B0E14" stroke-width="5" fill="none" opacity="0.75" />
  <path d="M 120,0 Q 140,160 125,320 T 150,512" stroke="#1E2633" stroke-width="1.5" fill="none" opacity="0.5" />

  <!-- Major Asphalt Branching Fissure / Cracks (Top-Down Realistic) -->
  <!-- Crack Network A -->
  <g opacity="0.88">
    <!-- Crack shadow / depth -->
    <path d="M 45,60 Q 75,95 110,110 T 180,135 T 220,190 T 260,210 T 320,225" stroke="#05070A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Crack highlight edge (sunlit lip) -->
    <path d="M 46,59 Q 76,94 111,109 T 181,134 T 221,189 T 261,209 T 321,224" stroke="#334155" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sub-branches -->
    <path d="M 110,110 Q 130,85 160,80" stroke="#07090E" stroke-width="1.8" fill="none" />
    <path d="M 180,135 Q 195,165 210,180" stroke="#07090E" stroke-width="1.6" fill="none" />
    <path d="M 260,210 Q 285,185 305,175" stroke="#07090E" stroke-width="1.4" fill="none" />
    <path d="M 220,190 Q 210,240 230,270" stroke="#07090E" stroke-width="1.6" fill="none" />
  </g>

  <!-- Crack Network B (South-East quadrant) -->
  <g opacity="0.85">
    <path d="M 460,340 Q 410,360 370,395 T 310,430 T 270,470" stroke="#05070A" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M 461,339 Q 411,359 371,394 T 311,429 T 271,469" stroke="#334155" stroke-width="0.7" fill="none" stroke-linecap="round" />
    <path d="M 370,395 Q 360,420 345,445" stroke="#07090E" stroke-width="1.5" fill="none" />
    <path d="M 310,430 Q 295,410 275,405" stroke="#07090E" stroke-width="1.3" fill="none" />
  </g>

  <!-- Spiderweb micro-cracks -->
  <g stroke="#090C12" stroke-width="1.0" fill="none" opacity="0.6">
    <path d="M 80,380 L 105,395 L 120,385 L 140,410 L 165,405" />
    <path d="M 105,395 L 100,420 L 115,435" />
    <path d="M 360,80 L 375,95 L 400,90 L 415,115" />
  </g>

  <!-- MOTOR OIL STAINS & IRIDESCENT OIL SLICKS -->
  <!-- Primary Large Heavy Oil Puddle with Rainbow Iridescence -->
  <g transform="translate(195, 290)">
    <!-- Base dark saturated asphalt stain absorption halo -->
    <path d="M -65,-30 C -85,-10 -75,45 -35,65 C 5,80 55,70 80,40 C 95,15 85,-25 55,-45 C 20,-60 -40,-50 -65,-30 Z" fill="#090B10" opacity="0.75" />
    <!-- Viscous black oil body with vibrant thin-film interference -->
    <path d="M -50,-22 C -65,-5 -60,35 -25,50 C 5,62 45,55 65,30 C 78,12 70,-18 45,-35 C 18,-48 -30,-38 -50,-22 Z" fill="url(#oilSheen1)" />
    <!-- Core deep motor grease center -->
    <ellipse cx="2" cy="4" rx="28" ry="20" fill="#030303" opacity="0.88" />
    <ellipse cx="-4" cy="2" rx="14" ry="9" fill="#010101" opacity="0.95" />
    <!-- Specular wet highlight dots -->
    <circle cx="-6" cy="-8" r="2.5" fill="#38BDF8" opacity="0.55" />
    <circle cx="12" cy="10" r="1.8" fill="#EC4899" opacity="0.45" />
    <circle cx="-16" cy="14" r="1.5" fill="#FBBF24" opacity="0.4" />
  </g>

  <!-- Secondary Engine Drip Oil Stain (Vehicle parking leak) -->
  <g transform="translate(385, 150)">
    <path d="M -35,-18 C -48,-3 -42,25 -18,36 C 5,45 35,38 46,20 C 56,6 48,-14 30,-26 C 10,-35 -20,-28 -35,-18 Z" fill="url(#oilSheen2)" />
    <ellipse cx="3" cy="2" rx="16" ry="11" fill="#040404" opacity="0.90" />
    <circle cx="5" cy="-2" r="1.8" fill="#38BDF8" opacity="0.5" />
  </g>

  <!-- Satellite Droplets & Oily Splatters -->
  <g fill="#070707" opacity="0.85">
    <circle cx="125" cy="265" r="4.2" />
    <circle cx="118" cy="254" r="2.5" />
    <circle cx="134" cy="275" r="3.0" />
    <circle cx="285" cy="380" r="3.8" />
    <circle cx="295" cy="392" r="2.2" />
    <circle cx="340" cy="185" r="3.4" />
    <circle cx="430" cy="195" r="3.8" />
    <circle cx="442" cy="204" r="2.0" />
  </g>
</svg>
