name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # El sitio cuelga de /eko-cobra-einsatzbefehl/, así que Vite necesita ese base.
      - name: Build
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Lo publicado se mide con el mismo script que el CI, pero contra la URL real:
      # un base o un Content-Type mal servido por Pages no aparece en el build local.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # El navegador de Playwright (~150 MB) es el mismo entre publicaciones: se cachea
      # por versión del lockfile, así que solo se descarga cuando cambia Playwright.
      - name: Cachear el navegador de Playwright
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # Los .deb de las deps del sistema se cachean aparte del navegador: así un
      # acierto reinstala sin red y el dry-run puede omitir apt de verdad.
      - name: Cachear paquetes apt de Playwright
        id: cache-apt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: apt-playwright-${{ runner.os }}-

      - name: Restaurar paquetes apt en la caché del sistema
        if: steps.cache-apt.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -a "${{ runner.temp }}/apt-archives/." /var/cache/apt/archives/

      - name: Instalar Chromium para la prueba de humo
        run: |
          echo "caché de Playwright: ${{ steps.cache-playwright.outputs.cache-hit || 'no' }}"
          echo "caché de apt: ${{ steps.cache-apt.outputs.cache-hit || 'no' }}"
          # El navegador se verifica/descarga igual que antes (no cambia la comprobación).
          npx playwright install chromium
          inicio=$(date +%s)
          # En acierto se instalan los .deb cacheados sin red: dpkg queda al día y el
          # dry-run pasa, así que apt no vuelve a descargar ni instalar nada.
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" = "true" ]; then
            sudo dpkg -i /var/cache/apt/archives/*.deb || true
            sudo apt-get -f install -y --no-download || true
          fi
          if npx playwright install-deps chromium --dry-run; then
            echo "dependencias del sistema ya presentes: se omite apt"
            apt_necesario=no
          else
            echo "faltan dependencias del sistema: se ejecuta apt"
            npx playwright install-deps chromium
            apt_necesario=si
          fi
          fin=$(date +%s)
          echo "tiempo dependencias del sistema: $((fin - inicio)) s (apt: $apt_necesario)"

      - name: Guardar paquetes apt descargados
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/apt-archives"
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "${{ runner.temp }}/apt-archives" {} +

      # El CDN de Pages puede seguir sirviendo el HTML anterior (se cachea 10 min).
      # Se espera a que aparezca la marca del commit publicado antes de medir nada;
      # así un fallo aquí es del despliegue y no de una caché lenta.
      - name: Esperar a que Pages sirva este commit
        id: espera
        env:
          SHA: ${{ github.sha }}
          URL_PUBLICADA: ${{ steps.deployment.outputs.page_url }}
        run: |
          for intento in $(seq 1 30); do
            if curl -fsSL -H 'cache-control: no-cache' "$URL_PUBLICADA" | grep -q "name=\"eko-build\" content=\"$SHA\""; then
              echo "Pages ya sirve $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages sigue sin servir el commit $SHA tras 5 minutos"
          exit 1

      # Los reintentos son solo por un fallo de red puntual: la marca del build ya
      # garantiza que lo medido es este commit y no el HTML anterior.
      - name: Prueba de humo contra la URL publicada
        id: humo
        env:
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for intento in 1 2 3; do
            if node scripts/smoke.mjs "${{ steps.deployment.outputs.page_url }}" > humo.log 2>&1; then
              cat humo.log
              exit 0
            fi
            cat humo.log
            if [ "$intento" -lt 3 ]; then
              echo "::warning::intento $intento fallido; se espera 30 s por si es caché del CDN"
              sleep 30
            fi
          done
          echo "::error::la URL publicada no pasa la prueba de humo"
          exit 1

      # Igual que en el CI: un fallo aquí solo dejaba el log del run, que se pierde. El
      # informe.txt del artifact dice qué comprobación falló; si el humo se reintentó,
      # quedan los ficheros del último intento, que es el que decide.
      - name: Subir captura e informe del humo publicado
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-fallos-publicado
          path: .smoke-fallos
          if-no-files-found: ignore
          retention-days: 7

      # Un run rojo sin contexto no dice si el sitio quedó bien o mal: el resumen deja
      # escrito que SÍ se publicó y con qué problema, para que no se pierda en el rojo.
      - name: Resumen del despliegue con problemas
        if: failure()
        env:
          URL_PUBLICADA: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
          ESPERA: ${{ steps.espera.outcome }}
          HUMO: ${{ steps.humo.outcome }}
        run: |
          if [ "$ESPERA" = "failure" ]; then
            paso='Esperar a que Pages sirva este commit'
            detalle='Pages no sirvió en 5 minutos la marca de build del commit, así que puede estar sirviendo el HTML anterior.'
          elif [ "$HUMO" = "failure" ]; then
            paso='Prueba de humo contra la URL publicada'
            detalle='La URL publicada no pasa la prueba de humo: canvas, misiones, móvil, metadatos, pesos, Content-Type o caché.'
          else
            paso='Preparación del humo (npm ci o Chromium)'
            detalle='El sitio se publicó, pero la preparación del humo no llegó a medir la URL publicada.'
          fi

          {
            echo '## ⚠️ El sitio quedó publicado con un problema'
            echo ''
            echo "El commit \`$SHA\` se publicó en $URL_PUBLICADA y la comprobación posterior ha fallado."
            echo ''
            echo '| Dato | Valor |'
            echo '| --- | --- |'
            echo "| URL comprobada | $URL_PUBLICADA |"
            echo "| Commit publicado | \`$SHA\` |"
            echo "| Paso que falló | \`$paso\` |"
            echo ''
            echo "$detalle"
            echo ''
            if [ -s humo.log ]; then
              echo '### Últimas líneas del humo'
              echo '```'
              tail -n 30 humo.log
              echo '```'
            fi
            echo ''
            echo 'El despliegue queda en rojo: revisa el log del paso antes de volver a desplegar.'
          } >> "$GITHUB_STEP_SUMMARY"
