name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela el run anterior de la misma rama: no gasta minutos en un
# commit que ya nadie mira ni retrasa al que sí importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck (strict)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Misma clave que el job de deploy: quien pobló la caché primero sirve a los dos,
      # y solo se descarga el navegador cuando cambia la versión de Playwright.
      - name: Cachear el navegador de Playwright
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Instalar Chromium para la prueba de humo
        run: |
          echo "caché de Playwright: ${{ steps.cache-playwright.outputs.cache-hit || 'no' }}"
          # El navegador se verifica/descarga igual que antes (no cambia la comprobación).
          npx playwright install chromium
          # Las dependencias del sistema solo se instalan con apt si faltan: en acierto
          # de caché (y runner con deps presentes) el dry-run sale 0 y se omite apt.
          inicio=$(date +%s)
          if npx playwright install-deps chromium --dry-run; then
            echo "dependencias del sistema ya presentes: se omite apt"
            apt_necesario=no
          else
            echo "faltan dependencias del sistema: se ejecuta apt"
            npx playwright install-deps chromium
            apt_necesario=si
          fi
          fin=$(date +%s)
          echo "tiempo dependencias del sistema: $((fin - inicio)) s (apt: $apt_necesario)"

      # Compila con el base de GitHub Pages: así se cazan las rutas de assets mal resueltas.
      - name: Build (base de Pages)
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
        run: npm run build

      - name: Prueba de humo en navegador
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
        run: npm run smoke

      # Cuando el humo falla, el mensaje no dice qué se veía: la captura y la traza
      # de Playwright quedan en `.smoke-fallos/` y aquí se adjuntan al run.
      - name: Subir captura y traza del humo
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-fallos
          path: .smoke-fallos
          if-no-files-found: ignore
          retention-days: 7
