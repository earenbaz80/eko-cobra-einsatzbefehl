name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Cobertura completa nocturna: detecta regresiones aunque no haya pushes.
  schedule:
    - cron: '0 3 * * *'

# Un push nuevo cancela el run anterior de la misma rama: no gasta minutos en un
# commit que ya nadie mira ni retrasa al que sí importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck (strict)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  smoke:
    # En PR basta con canvas, Misión 1, transiciones y peso de arranque —el único
    # tope de peso que vigilan los dos perfiles—; en main y nightly corre el perfil
    # completo, igual que el smoke posterior al deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # La imagen oficial ya trae Chromium y todas las dependencias del sistema: no se
    # ejecuta apt/dpkg ni se descarga el navegador en cada run. El tag debe coincidir
    # con la versión de playwright del package-lock.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      # Chromium usa /dev/shm; con el tamaño por defecto puede quedarse sin memoria.
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Comprobar la imagen de Playwright
        run: |
          node --version
          npx playwright --version
          test -d "$PLAYWRIGHT_BROWSERS_PATH"

      # Compila con el base de GitHub Pages: así se cazan las rutas de assets mal resueltas.
      - name: Build (base de Pages)
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
        run: npm run build

      - name: Prueba de humo en navegador
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
          # pull_request -> quick; push a main y schedule -> full.
          SMOKE_PROFILE: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
        run: npm run smoke

      # Cuando el humo falla, el mensaje no dice qué se veía: la captura y la traza
      # de Playwright quedan en `.smoke-fallos/` y aquí se adjuntan al run.
      - name: Subir captura y traza del humo
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-fallos
          path: .smoke-fallos
          if-no-files-found: ignore
          retention-days: 7
