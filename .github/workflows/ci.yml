name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck (strict)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Instalar Chromium para la prueba de humo
        run: npx playwright install --with-deps chromium

      # Compila con el base de GitHub Pages: así se cazan las rutas de assets mal resueltas.
      - name: Build (base de Pages)
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
        run: npm run build

      - name: Prueba de humo en navegador
        env:
          VITE_BASE_PATH: /eko-cobra-einsatzbefehl/
        run: npm run smoke
